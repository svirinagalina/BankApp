# ========== Kafka ==========
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.katacademy.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.group-id=notification-service
# ========== H2 Database ==========
spring.datasource.url=jdbc:h2:mem:notificationsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Автоматическое создание/обновление таблиц
spring.jpa.hibernate.ddl-auto=update
# Показывать SQL в консоли
spring.jpa.show-sql=true
# Включить web-консоль H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
