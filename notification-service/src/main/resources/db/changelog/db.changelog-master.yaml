databaseChangeLog:
  #- logicalFilePath: db/changelog/db.changelog-lesson1.yaml
  - changeSet:
      id: 1
      author: nabeev_vasil
      changes:
        - createTable:
            tableName: notification_log
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: timestamp
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: nabeev_vasil
      comment: ""
      changes:
        - insert:
            tableName: notification_log
            columns:
              - column:
                  name: message
                  value: "Hello world"
              - column:
                  name: timestamp
                  valueDate: "CURRENT_TIMESTAMP"