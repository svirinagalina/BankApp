spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/audit_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: kafka:9092

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

flyway:
  enabled: true
  baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always