server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Gateway, bank-gateway
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-XSS-Protection, 0
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddResponseHeader=Strict-Transport-Security, max-age=31536000; includeSubDomains

      routes:
        - id: swagger-ui
          uri: http://account-service:8080
          predicates:
            - Path=/,/swagger-ui.html
          filters:
            - SetPath=/swagger-ui.html

        - id: swagger-resources
          uri: http://account-service:8080
          predicates:
            - Path=/webjars/**,/swagger-ui/**
          filters:
            - PreserveHostHeader

        - id: account-service-openapi
          uri: http://account-service:8080
          predicates:
            - Path=/account-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: kyc-service-openapi
          uri: http://kyc-service:8080
          predicates:
            - Path=/kyc-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        - id: user-settings-service-openapi
          uri: http://user-settings-service:8080
          predicates:
            - Path=/user-settings-service/v3/api-docs
          filters:
            - SetPath=/v3/api-docs

        #      БИЗНЕС-МАРШРУТЫ СЕРВИСОВ
        - id: account-service
          uri: http://account-service:8080
          predicates:
            - Path=/account-service/**
          filters:
            - StripPrefix=1

        - id: kyc-service
          uri: http://kyc-service:8080
          predicates:
            - Path=/kyc-service/**
          filters:
            - StripPrefix=1

        - id: user-settings-service
          uri: http://user-settings-service:8080
          predicates:
            - Path=/user-settings-service/**
          filters:
            - StripPrefix=1

#     SPRINGDOC CONFIG
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    default-models-expand-depth: 1
    default-model-expand-depth: 1
    doc-expansion: none
    tags-sorter: alpha
    operations-sorter: alpha
    # ссылки на все сервисы в dropdown(при необходимости добавьте сервису сюжа и в routes)
    urls:
      - url: /account-service/v3/api-docs
        name: Account Service
      - url: /kyc-service/v3/api-docs
        name: kyc Service
      - url: /user-settings-service/v3/api-docs
        name: User Settings Service

    config-url: /v3/api-docs/swagger-config
    urls-primary-name: Kyc Service

management:
  endpoints:
    web:
      exposure:
        include: health,info,liveness,readiness,gateway,routes
  endpoint:
    gateway:
      enabled: true
    health:
      probes:
        enabled: true
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springdoc: DEBUG