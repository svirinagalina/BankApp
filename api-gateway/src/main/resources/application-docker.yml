server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Gateway, bank-gateway
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-XSS-Protection, 0
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddResponseHeader=Strict-Transport-Security, max-age=31536000; includeSubDomains
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          max-idle-time: 30s
      routes:
        - id: account-service
          uri: http://account-service:8080
          predicates:
            - Path=/api/accounts/**
          filters:
            - StripPrefix=2
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2

            - name: CircuitBreaker
              args:
                name: accountCircuit
                fallbackUri: forward:/fallback/account

        - id: security-service
          uri: http://security-service:8080
          predicates:
            - Path=/api/security/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                exceptions: java.net.ConnectException, java.net.NoRouteToHostException

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: securityCircuit
                fallbackUri: forward:/fallback/security

        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                exceptions: java.net.ConnectException, java.net.NoRouteToHostException

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: notificationCircuit
                fallbackUri: forward:/fallback/notification

        - id: fraud-detection
          uri: http://fraud-detection:8080
          predicates:
            - Path=/api/fraud/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                exceptions: java.net.ConnectException, java.net.NoRouteToHostException

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: fraudCircuit
                fallbackUri: forward:/fallback/fraud

        - id: audit-service
          uri: http://audit-service:8080
          predicates:
            - Path=/api/audits/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                exceptions: java.net.ConnectException, java.net.NoRouteToHostException

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: auditCircuit
                fallbackUri: forward:/fallback/audit

        - id: kyc-service
          uri: http://kyc-service:8080
          predicates:
            - Path=/api/kyc/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                exceptions: java.net.ConnectException, java.net.NoRouteToHostException

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: kycCircuit
                fallbackUri: forward:/fallback/kyc

        - id: settings-service
          uri: http://settings-service:8080
          predicates:
            - Path=/api/settings/**
          filters:
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                exceptions: java.net.ConnectException, java.net.NoRouteToHostException

                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: settingsCircuit
                fallbackUri: forward:/fallback/settings
cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      accountCircuit:
        baseConfig: default
      securityCircuit:
        baseConfig: default
      notificationCircuit:
        baseConfig: default
      fraudCircuit:
        baseConfig: default
      auditCircuit:
        baseConfig: default
      kycCircuit:
        baseConfig: default
      settingsCircuit:
        baseConfig: default
