server:
  port: 8765

spring:
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Gateway, bank-gateway
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-XSS-Protection, 0
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddResponseHeader=Strict-Transport-Security, max-age=31536000; includeSubDomains
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          max-idle-time: 30s
      routes:
        - id: account-service
          uri: http://account-service:8080
          predicates:
            - Path=/account-service/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: accountCircuit
                fallbackUri: forward:/fallback/account

        - id: kyc-service
          uri: http://kyc-service:8080
          predicates:
            - Path=/kyc-service/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: kycCircuit
                fallbackUri: forward:/fallback/kyc

        - id: user-settings-service
          uri: http://user-settings-service:8080
          predicates:
            - Path=/user-settings-service/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
            - name: CircuitBreaker
              args:
                name: settingsCircuit
                fallbackUri: forward:/fallback/settings

        - id: fraud-detection
          uri: http://fraud-detection:8080
          predicates:
            - Path=/fraud-detection/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2

        - id: audit-service
          uri: http://audit-service:8080
          predicates:
            - Path=/audit-service/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://notification-service:8080
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1

        - id: security-service
          uri: http://security-service:8080
          predicates:
            - Path=/security-service/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      accountCircuit:
        baseConfig: default
      kycCircuit:
        baseConfig: default
      settingsCircuit:
        baseConfig: default
