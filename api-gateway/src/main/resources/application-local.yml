server:
  port: 8080

spring:
  cloud:
    gateway:
      default-filters:
        - AddResponseHeader=X-Gateway, bank-gateway
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-XSS-Protection, 0
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddResponseHeader=Strict-Transport-Security, max-age=31536000; includeSubDomains

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
        pool:
          max-idle-time: 30s

      routes:
        - id: account-service
          uri: http://localhost:8081
          predicates:
            - Path=/account-service/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
            - name: CircuitBreaker
              args:
                name: accountCircuit
                fallbackUri: forward:/fallback/account

        - id: kyc-service
          uri: http://localhost:8086
          predicates:
            - Path=/kyc-service/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
            - name: CircuitBreaker
              args:
                name: kycCircuit
                fallbackUri: forward:/fallback/kyc

        - id: user-settings-service
          uri: http://localhost:8091
          predicates:
            - Path=/user-settings-service/**
          filters:
            - StripPrefix=1
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, GATEWAY_TIMEOUT, INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                series: SERVER_ERROR
            - name: CircuitBreaker
              args:
                name: settingsCircuit
                fallbackUri: forward:/fallback/settings

        - id: fraud-detection
          uri: http://localhost:8084
          predicates:
            - Path=/fraud-detection/**
          filters:
            - StripPrefix=1

        - id: audit-service
          uri: http://localhost:8082
          predicates:
            - Path=/audit-service/**
          filters:
            - StripPrefix=1

        - id: notification-service
          uri: http://localhost:8089
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1

        - id: security-service
          uri: http://localhost:8090
          predicates:
            - Path=/security-service/**
          filters:
            - StripPrefix=1

        - id: auth-statistics-service
          uri: http://localhost:8083
          predicates:
            - Path=/auth-statistics-service/**
          filters:
            - StripPrefix=1

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /
    urls:
      - name: account-service
        url: /account-service/v3/api-docs
      - name: audit-service
        url: /audit-service/v3/api-docs
      - name: security-service
        url: /security-service/v3/api-docs
      - name: kyc-service
        url: /kyc-service/v3/api-docs
      - name: user-settings-service
        url: /user-settings-service/v3/api-docs
      - name: auth-statistics-service
        url: /auth-statistics-service/v3/api-docs
      - name: fraud-detection
        url: /fraud-detection/v3/api-docs
      - name: notification-service
        url: /notification-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
      base-path: /actuator
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 5
    instances:
      accountCircuit:
        baseConfig: default
      kycCircuit:
        baseConfig: default
      settingsCircuit:
        baseConfig: default

gateway:
  downstream:
    services:
      account-service:
        base-url: http://localhost:8081
      kyc-service:
        base-url: http://localhost:8086
      user-settings-service:
        base-url: http://localhost:8091
      audit-service:
        base-url: http://localhost:8082
      security-service:
        base-url: http://localhost:8090
      auth-statistics-service:
        base-url: http://localhost:8083
      fraud-detection:
        base-url: http://localhost:8084
      notification-service:
        base-url: http://localhost:8089