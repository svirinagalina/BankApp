stages:
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1024m"

before_script:
  - chmod +x gradlew

build:
  stage: build
  image: gradle:8.5-jdk21
  script:
    - ./gradlew clean build checkstyleMain checkstyleTest --no-daemon
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always
    - when: never