stages:
  - build

services:
  # Первый Postgres для bankapp, fraud-detection, settings-service
  - name: postgres:15
    alias: postgres
  # Второй Postgres для user-service (будет доступен как user-service_postgres:5432)
  - name: postgres:15
    alias: user-service_postgres
  # Kafka для всех сервисов
  - name: bitnami/kafka:3.6
    alias: kafka

variables:
  # Переменные для первого Postgres
  POSTGRES_DB: userDB
  POSTGRES_USER: root
  POSTGRES_PASSWORD: root

  # Переменные для второго Postgres
  USER_SERVICE_POSTGRES_DB: mainDB
  USER_SERVICE_POSTGRES_USER: root
  USER_SERVICE_POSTGRES_PASSWORD: root

  # Kafka переменные
  KAFKA_CFG_NODE_ID: 1
  KAFKA_CFG_PROCESS_ROLES: controller,broker

before_script:
  - chmod +x gradlew

build:
  stage: build
  image: gradle:8.5-jdk21
  script:
    - echo "Waiting for Postgres and Kafka..."
    - for i in {1..30}; do pg_isready -h postgres -p 5432 -U root && break || sleep 2; done
    - for i in {1..30}; do pg_isready -h user-service_postgres -p 5432 -U root && break || sleep 2; done
    - for i in {1..30}; do nc -z kafka 9092 && break || sleep 2; done

    - ./gradlew clean build checkstyleMain checkstyleTest --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/checkstyle
      - build/reports/tests
