stages:
  - build

services:
  - name: wurstmeister/zookeeper:3.4.6
    alias: zookeeper
  - name: wurstmeister/kafka:2.13-2.8.1
    alias: kafka
  - name: postgres:15
    alias: postgres
  - name: postgres:15
    alias: user-service_postgres

variables:
  KAFKA_ADVERTISED_HOST_NAME: kafka
  KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  POSTGRES_DB: userDB
  POSTGRES_USER: root
  POSTGRES_PASSWORD: root

  USER_SERVICE_POSTGRES_DB: mainDB
  USER_SERVICE_POSTGRES_USER: root
  USER_SERVICE_POSTGRES_PASSWORD: root

before_script:
  - chmod +x gradlew
  - echo "Жду 40 секунд, пока поднимутся Postgres, Zookeeper и Kafka..."
  - sleep 40

build:
  stage: build
  image: gradle:8.5-jdk21
  script:
    - ./gradlew clean build checkstyleMain checkstyleTest --no-daemon
  artifacts:
    when: always
    paths:
      - build/reports/checkstyle
      - build/reports/tests
