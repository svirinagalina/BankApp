workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - when: never

stages:
  - guard
  - lint
  - test
  - deploy

variables:
  # чтобы gradle кешировался в рабочей директории и попадал в cache
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1024m"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches
    - .gradle/daemon
    - .gradle/native
    - .gradle/notifications
    - build/

before_script:
  - chmod +x gradlew
  # каталоги отчётов — чтобы artifacts не падали, если gradle сломался раньше
  - mkdir -p build/reports/checkstyle build/reports/spotbugs build/test-results/test build/reports/tests/test

# проверяем, что новые файлы .java не появятся в старых монолитных путях, не вернутся импорты
guard_monolith:
  stage: guard
  image: alpine:3.19
  before_script:
    - apk add --no-cache git grep findutils
  script:
    - |
      set -euo pipefail
      echo "🔎 Guard: checking forbidden monolith sources and imports"

      # каталоги, которые не должны содержать .java
      dirs="src/main/java/ru/katacademy/bank_app/account
            src/main/java/ru/katacademy/bank_app/notification
            src/main/java/ru/katacademy/bank_app/shared
            src/main/java/ru/katacademy/bank_app/transaction
            bank-app/src/main/java/ru/katacademy/bank_app/account
            bank-app/src/main/java/ru/katacademy/bank_app/notification
            bank-app/src/main/java/ru/katacademy/bank_app/shared
            bank-app/src/main/java/ru/katacademy/bank_app/transaction"

      fail=0
      for d in $dirs; do
        if [ -d "$d" ] && find "$d" -type f -name '*.java' | grep -q . ; then
          echo "❌ Forbidden Java sources found in: $d"
          find "$d" -type f -name '*.java' | head -n 10 || true
          fail=1
        fi
      done

      # запрет импортов из старых пакетов
      if git grep -nE "import\s+ru\.katacademy\.bank_app\.(account|notification|shared|transaction)\." -- \
           . ":(exclude)docs/**" ":(exclude)**/build/**" ":(exclude)**/out/**" ":(exclude)**/target/**" ; then
        echo "❌ Forbidden imports detected above."
        fail=1
      fi

      if [ "$fail" -ne 0 ]; then
        exit 1
      fi

      echo "✅ Guard passed."
  allow_failure: false


lint:
  stage: lint
  image: gradle:8.5-jdk21
  script:
    # форсим скачивание дистрибутива (если нужно) и даём пару ретраев на случай сетевых таймаутов
    - ./gradlew -v || ./gradlew -v || ./gradlew -v
    - ./gradlew checkstyleMain checkstyleTest spotbugsMain spotbugsTest --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - build/reports/checkstyle/
      - build/reports/spotbugs/
    # ВАЖНО: SpotBugs XML ≠ GitLab Code Quality. Если нужен Code Quality,
    # генерируй отчет в формате CodeClimate и укажи его здесь.
    # reports:
    #   codequality: build/reports/codequality/codeclimate.json

test:
  stage: test
  image: gradle:8.5-jdk21
  script:
    - ./gradlew test --no-daemon --stacktrace
  artifacts:
    when: always
    paths:
      - build/test-results/test/
      - build/reports/tests/test/
    reports:
      junit: build/test-results/test/TEST-*.xml

deploy:
  stage: deploy
  script:
    - echo "Deploy step"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
