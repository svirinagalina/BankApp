spring.application.name=fraud-detection

kyc.topics.events=kyc-events

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=fraud-detection
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.katacademy.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=ru.katacademy.bank_shared.event.kyc.KycStatusChangedEvent


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.group.readiness.include=db
management.endpoint.health.group.liveness.include=ping
