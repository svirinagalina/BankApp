server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/auth_stats_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: auth_statistics_service_local

  liquibase:
    enabled: false

  flyway:
    enabled: false

  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: auth-statistics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

bank:
  security:
    enabled: false