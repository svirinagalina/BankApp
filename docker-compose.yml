  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
#    restart: unless-stopped
    ports:
      - "8765:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      SPRING_MAIN_BANNER_MODE: "off"
      LOGGING_LEVEL_ROOT: "INFO"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: "WARN"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/liveness && wget --spider -q http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  audit-service:
    build:
      context: ./audit
      dockerfile: Dockerfile
    container_name: audit-service
#    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/audit_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_JPA_HIBERNATE_DDL_AUTO: none

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget --spider -q http://localhost:8080/actuator/health/liveness && \
         wget --spider -q http://localhost:8080/actuator/health/readiness"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
#    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/account_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KYC_TOPICS_EVENTS: kyc-events
      SPRING_KAFKA_PRODUCER_KEY_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_PRODUCER_VALUE_SERIALIZER: org.apache.kafka.common.serialization.StringSerializer
      SPRING_KAFKA_CONSUMER_KEY_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer
      SPRING_KAFKA_CONSUMER_VALUE_DESERIALIZER: org.apache.kafka.common.serialization.StringDeserializer

      SPRING_CLOUD_CONFIG_ENABLED: "false"
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"

      SECURITY_JWT_SECRET: "supersecretkeyforlocaldev"

      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN
      LOGGING_LEVEL_FEIGN: WARN

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  kyc-service:
    build:
      context: ./kyc-service
      dockerfile: Dockerfile
    container_name: kyc-service
#    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kyc_verifications
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none #update

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kyc-documents

      SPRING_PROFILES_ACTIVE: docker
      LOGGING_LEVEL_ROOT: INFO

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  user-settings-service:
    build:
      context: ./user-settings-service
      dockerfile: Dockerfile
    container_name: user-settings-service
#    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settings_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN

    healthcheck:
      test: [
        "CMD-SHELL",
        "wget --spider -q http://localhost:8080/actuator/health/liveness && \
         wget --spider -q http://localhost:8080/actuator/health/readiness"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  minio-bootstrap:
    image: minio/mc
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: [ "/bin/sh","-c" ]
    command: >
      mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
      mc mb -p local/kyc-files || true
    restart: "no"

  swagger-aggregator:
    image: swaggerapi/swagger-ui:latest
    container_name: swagger_aggregator
    ports:
      - "80:8080"
    environment:
      URL: ''
      URLS: '[{"url":"http://localhost:8082/v3/api-docs", "name":"User Settings Service"}, {"url":"http://localhost:8084/v3/api-docs", "name":"Kyc Service"}, {"url":"http://localhost:8088/v3/api-docs", "name":"Account Service"}]'
      URLS_PRIMARY_NAME: 'Kyc Service'
    depends_on:
      account-service:
        condition: service_started
      kyc-service:
        condition: service_started
      user-settings-service:
        condition: service_started

volumes:
  postgres_data:
  kafka_data:
  user-db-data:
  minio_data:
