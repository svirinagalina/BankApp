#version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bankapp-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: userDB
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka
    #    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG4J_OPTS: "-Dlog4j.configuration=file:/etc/kafka/log4j.properties"
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./config/kafka/log4j.properties:/etc/kafka/log4j.properties
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9091:9091"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka:9092"
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: WARN
      SCHEMA_REGISTRY_COMPATIBILITY_LEVEL: BACKWARD
    volumes:
      - ./shared/kafka/config:/etc/kafka
      - ./shared/kafka/schemas:/schemas
      - schema_registry_secrets:/etc/schema-registry/secrets
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9091/subjects || exit 1" ]
      interval: 10s
      retries: 10
      start_period: 20s
#
#  kafdrop:
#    image: obsidiandynamics/kafdrop:4.0.1
#    container_name: kafdrop
#    restart: "no"
#    ports:
#      - "9090:9000"
#    environment:
#      KAFKA_BROKERCONNECT: "kafka:9092"
#      JVM_OPTS: "-XX:-TieredCompilation -XX:+UseStringDeduplication -noverify"
#      SCHEMAREGISTRY_URL: "http://schema-registry:8081"
#    depends_on:
#      kafka:
#        condition: service_healthy
#      schema-registry:
#        condition: service_healthy

  minio:
    image: minio/minio
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  fraud-detection:
    build:
      context: ./fraud-detection
      dockerfile: Dockerfile
    container_name: fraud-detection
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/userDB
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_PROFILES_ACTIVE: docker

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      USER_SERVICE_URL: http://account-service:8080

      SPRING_MAIN_BANNER_MODE: "off"

      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA_CLIENTS: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA_COMMON_METRICS: ERROR
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8087:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notifications_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: docker
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: WARN
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA_CLIENTS: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA_COMMON_METRICS: ERROR
      SPRING_MAIN_BANNER_MODE: "off"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "80:8080"  # оставляем 80:8080
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_MAIN_BANNER_MODE: "off"
    depends_on:
      account-service:
        condition: service_healthy
      kyc-service:
        condition: service_healthy
      user-settings-service:
        condition: service_healthy
      fraud-detection:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      auth-statistics-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/liveness && wget --spider -q http://localhost:8080/actuator/health/readiness" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  auth-statistics-service:
    build:
      context: ./auth-statistics-service
      dockerfile: Dockerfile
    container_name: auth-statistics-service
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8089:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget --spider -q http://localhost:8080/actuator/health/liveness && \
         wget --spider -q http://localhost:8080/actuator/health/readiness"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  audit-service:
    build:
      context: ./audit
      dockerfile: Dockerfile
    container_name: audit-service
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: [
        "CMD-SHELL",
        "wget --spider -q http://localhost:8080/actuator/health/liveness && \
           wget --spider -q http://localhost:8080/actuator/health/readiness"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8088:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KYC_TOPICS_EVENTS: kyc-events
      SECURITY_JWT_SECRET: "supersecretkeyforlocaldev"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health/liveness && wget --spider -q http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  kyc-service:
    build:
      context: ./kyc-service
      dockerfile: Dockerfile
    container_name: kyc-service
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kyc_verifications
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none #update

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: kyc-documents

      SPRING_PROFILES_ACTIVE: docker
      LOGGING_LEVEL_ROOT: INFO

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  user-settings-service:
    build:
      context: ./user-settings-service
      dockerfile: Dockerfile
    container_name: user-settings-service
    #    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settings_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none

      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK: WARN
      LOGGING_LEVEL_ORG_HIBERNATE: WARN
      LOGGING_LEVEL_ORG_APACHE_KAFKA: WARN

    healthcheck:
      test: [
        "CMD-SHELL",
        "wget --spider -q http://localhost:8080/actuator/health/liveness && \
         wget --spider -q http://localhost:8080/actuator/health/readiness"
      ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  minio-bootstrap:
    image: minio/mc
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: [ "/bin/sh","-c" ]
    command: >
      mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
      mc mb -p local/kyc-files || true
    restart: "no"

