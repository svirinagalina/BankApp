server:
  port: 8080

spring:
  application:
    name: security-service

jwt:
  secret: "testsecretkeyfortestpurposesonly1234567890"
  expiration-ms: 3600000


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,liveness,readiness,ping
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
