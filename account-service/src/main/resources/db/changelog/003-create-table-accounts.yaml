databaseChangeLog:
  - changeSet:
      id: 003-create-table-accounts
      author: nabeev_vasil
      preConditions:
        onFail: HALT
        and:
          - tableExists:
              tableName: users
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_number
                  type: varchar(64)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: varchar(256)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: accounts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_accounts_user

  - changeSet:
      id: 003-insert-accounts-sample
      author: nabeev_vasil
      changes:
        - insert:
            tableName: accounts
            columns:
              - column:
                  name: account_number
                  value: "12345678901234567890"
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: balance
                  value: "1000.50|RUB|Russian Ruble|2"
              - column:
                  name: status
                  value: "ACTIVE"
              - column:
                  name: created_at
                  valueDate: "2025-01-01T00:00:00"
