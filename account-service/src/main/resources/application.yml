server:
  port: 8080

spring:
  application:
    name: account-service
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/mainDB
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none #update
    show-sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: kafka:9092
    topic:
      transferCompleted: transfer-completed-events
    producer: # Конфигурация продюсера (отправителя сообщений)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # Сериализатор для ключей сообщений (преобразует String в байты)
      value-serializer: org.springframework.kafka.support.serializer.ErrorHandlingSerializer # Сериализатор для значений сообщений
      retries: 3 # Количество попыток повторной отправки при неудаче
      acks: all
    consumer:
      group-id: account-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

cors:
  allowed-origins:
    - http://localhost:3000
    - http://localhost:8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      group:
        readiness:
          include: db,kafka
        liveness:
          include: ping

kyc-service:
  url: ${KYC_SERVICE_URL:http://kyc-service:8080}