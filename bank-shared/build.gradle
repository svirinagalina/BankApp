plugins {
    id 'java'
    id 'java-library'
    id("com.github.spotbugs") version "6.1.11"
}

group = 'ru.katacademy.bank-app'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}
dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'

    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.3'
    annotationProcessor 'com.github.spotbugs:spotbugs-annotations:4.8.3'

    implementation 'org.slf4j:slf4j-api:2.0.9'

    compileOnly 'org.aspectj:aspectjrt:1.9.20'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:4.8.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:4.8.0'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

tasks.spotbugsMain {
    reports.create("html") {
        required = true
        outputLocation = file("$rootDir/reports/spotbugs-bank-shared.html")
        setStylesheet("fancy-hist.xsl")
    }
    excludeFilter = file("config/spotbugs/exclude-filter.xml")
}

check.dependsOn spotbugsMain
check.dependsOn spotbugsTest

jar {
    enabled = true
    archiveClassifier = ''
}