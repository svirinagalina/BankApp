databaseChangeLog:
  - changeSet:
      id: 001-create-table-kyc-request
      author: nabeev_vasil
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            sql: CREATE EXTENSION IF NOT EXISTS pgcrypto;
        - createTable:
            tableName: kyc_request
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false

  - changeSet:
      id: 001-insert-kyc-request-sample
      author: nabeev_vasil
      changes:
        - insert:
            tableName: kyc_request
            columns:
              - column:
                  name: id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: user_id
                  valueNumeric: 1
              - column:
                  name: status
                  value: "PENDING"
              - column:
                  name: created_at
                  valueDate: "2025-01-01T00:00:00"
              - column:
                  name: updated_at
                  valueDate: "2025-01-01T00:00:00"
