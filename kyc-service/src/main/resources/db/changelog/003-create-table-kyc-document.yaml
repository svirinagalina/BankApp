databaseChangeLog:
  - changeSet:
      id: 003-create-table-kyc-document
      author: nabeev_vasil
      preConditions:
        onFail: HALT
        and:
          - tableExists:
              tableName: kyc_request
      changes:
        - createTable:
            tableName: kyc_document
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: kyc_request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: file_key
                  type: varchar(512)
                  constraints:
                    nullable: false
              - column:
                  name: uploaded_at
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: kyc_document
            baseColumnNames: kyc_request_id
            referencedTableName: kyc_request
            referencedColumnNames: id
            constraintName: fk_kyc_document_request

  - changeSet:
      id: 003-insert-kyc-document-sample
      author: nabeev_vasil
      changes:
        - insert:
            tableName: kyc_document
            columns:
              - column:
                  name: id
                  value: "33333333-3333-3333-3333-333333333333"
              - column:
                  name: kyc_request_id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: type
                  value: "passport"
              - column:
                  name: file_key
                  value: "test/passport.jpg"
              - column:
                  name: uploaded_at
                  valueDate: "2025-01-01T00:00:00"
