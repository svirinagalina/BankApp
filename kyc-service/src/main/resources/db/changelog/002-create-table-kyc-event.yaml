databaseChangeLog:
  - changeSet:
      id: 002-create-table-kyc-event
      author: nabeev_vasil
      preConditions:
        onFail: HALT
        and:
          - tableExists:
              tableName: kyc_request
      changes:
        - createTable:
            tableName: kyc_event
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: "gen_random_uuid()"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: kyc_request_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: "now()"
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: kyc_event
            baseColumnNames: kyc_request_id
            referencedTableName: kyc_request
            referencedColumnNames: id
            constraintName: fk_kyc_event_request

  - changeSet:
      id: 002-insert-kyc-event-sample
      author: nabeev_vasil
      changes:
        - insert:
            tableName: kyc_event
            columns:
              - column:
                  name: id
                  value: "22222222-2222-2222-2222-222222222222"
              - column:
                  name: kyc_request_id
                  value: "11111111-1111-1111-1111-111111111111"
              - column:
                  name: type
                  value: "CREATED"
              - column:
                  name: created_at
                  valueDate: "2025-01-01T00:00:00"
