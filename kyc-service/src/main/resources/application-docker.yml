server:
  port: 8080

spring:
  application:
    name: kyc-service
  jackson:
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://postgres:5432/kyc_verifications
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate.jdbc.time_zone: UTC

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

minio:
  endpoint: http://minio:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: kyc-documents
  auto-create-bucket: true

kyc:
  topics:
    events: kyc-events

bank:
  security:
    enabled: true